# XcodeGen: `brew install xcodegen && xcodegen generate && open Kipurse.xcodeproj`
name: Kipurse
options:
  bundleIdPrefix: org.example.kipurse
  developmentLanguage: en
  deploymentTarget: { iOS: "26.0" }   # t1247: was mis-indented under configFiles (ignored -> min iOS was the SDK's 27.2)
configFiles:
  Debug: Config/Kipurse.xcconfig
  Release: Config/Kipurse.xcconfig
packages:
  KipurseCore: { path: . }
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "97"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(KIPURSE_TEAM_ID)   # from Config/Local.xcconfig
targets:
  Kipurse:
    type: application
    platform: iOS
    sources:   # t784: never bundle backup copies (*.bak*, *.orig)
      - path: App/Sources
        excludes: ["**/*.bak*", "**/*.orig", "**/*.removed*"]
      - path: App/Resources
        excludes: ["**/*.bak*", "**/*.orig", "**/*.removed*"]
      - path: Shared
        excludes: ["**/*.bak*", "**/*.orig", "**/*.removed*"]
      - path: App/Assistant
        excludes: ["**/*.bak*", "**/*.orig", "**/*.removed*"]
    # App/Assistant = optional Siri / Spotlight module (remove it + KP_ASSISTANT below)
    # t1275 (#5): entitlements are two hand-kept files (XcodeGen's `entitlements:` key forces ONE file on both configs). Both carry the app group,
    # aps-environment development, App Attest production (t629, owner approved) and the keychain groups:
    #   Release App/Kipurse.entitlements      .keys (phone key + default group for every item) and .app   (phone key survives variant / bundle changes)
    #   Debug   App/KipurseDebug.entitlements the same + the Debug build's own .app.$(KIPURSE_DEBUG_SUFFIX) (Release no longer lists it)
    dependencies: [{ package: KipurseCore }, { target: KipurseWidget }]
    postBuildScripts:   # t1275 (#6): Release never talks to a local-network server (QR login refuses http://); only Debug UI tests use 127.0.0.1 mocks
      - name: "t1275 Release drops NSAllowsLocalNetworking"
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity:NSAllowsLocalNetworking" "$TARGET_BUILD_DIR/$INFOPLIST_PATH" 2>/dev/null || true; fi
        inputFiles: ["$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"]
        basedOnDependencyAnalysis: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"   # iPhone-only (portrait); avoids iPad multitasking orientation rule
        OTHER_SWIFT_FLAGS: "$(inherited) -DKP_ASSISTANT"
        ENABLE_DEBUG_DYLIB: NO   # one real executable that links AppIntents itself (Siri / Shortcuts registration on device)
      configs:
        Debug:   { PRODUCT_BUNDLE_IDENTIFIER: "$(KIPURSE_BUNDLE_ID_PREFIX).app.$(KIPURSE_DEBUG_SUFFIX)", KIPURSE_ONBOARD: "YES", SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG KP_DEV_MIGRATION", CODE_SIGN_ENTITLEMENTS: App/KipurseDebug.entitlements }   # t769u: Debug test build must show the Face ID / setup button; t1214 §6#101: the developer-only "switch to V5.4" screen exists ONLY in this Debug test build
        Release: { PRODUCT_BUNDLE_IDENTIFIER: "$(KIPURSE_BUNDLE_ID_PREFIX).app", KIPURSE_ONBOARD: "YES", CODE_SIGN_ENTITLEMENTS: App/Kipurse.entitlements }   # new-user onboarding (owner approved 2026-10-24)
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KipurseKeyGroup: $(AppIdentifierPrefix)$(KIPURSE_BUNDLE_ID_PREFIX).keys
        CFBundleDisplayName: $(KIPURSE_DISPLAY_NAME)
        INAlternativeAppNames:
          - { INAlternativeAppName: $(KIPURSE_SIRI_NAME_1) }
          - { INAlternativeAppName: $(KIPURSE_SIRI_NAME_2) }
          - { INAlternativeAppName: $(KIPURSE_SIRI_NAME_3) }
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: { UIColorName: LaunchBackground, UIImageName: LaunchLogo }
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        KipurseServer: $(KIPURSE_SERVER)
        KipurseMainnetServer: $(KIPURSE_MAINNET_SERVER)
        KipurseOwnerPay: $(KIPURSE_OWNER_PAY)
        KipurseOnboard: $(KIPURSE_ONBOARD)
        KipurseChainRPC: $(KIPURSE_CHAIN_RPC)
        KipurseDevWallet: $(KIPURSE_DEV_WALLET)   # Debug-only developer migration screen shows for this wallet (empty = never)
        KipurseSignLegacyHost: $(KIPURSE_SIGN_LEGACY_HOST)   # old signing host still accepted (empty = none)
        KipurseOperatorName: $(KIPURSE_OPERATOR_NAME)   # legal pages: operator name / address / support mail / governing law
        KipurseOperatorAddressEn: $(KIPURSE_OPERATOR_ADDRESS_EN)
        KipurseOperatorAddressZh: $(KIPURSE_OPERATOR_ADDRESS_ZH)
        KipurseSupportEmail: $(KIPURSE_SUPPORT_EMAIL)
        KipurseGoverningLawEn: $(KIPURSE_GOVERNING_LAW_EN)
        KipurseGoverningLawZh: $(KIPURSE_GOVERNING_LAW_ZH)
        KipurseRescuePages: "https://kipurse.github.io/rescue/|c1d0fd02bf78a17fb989db2305dd00d4fb7153a57fc017fefb3d2aa67a310d34,https://blush-managerial-damselfly-70.mypinata.cloud/ipfs/bafybeibumfy3tdutd7onrqsi5u4olhovawh3fl5oak7vgkbgkekonnrz4i/|597556f138f7d6181579399bfe3ad33400efed578e74fcdf1cdec737c2964e90"   # t1045 primary v27 GitHub Pages (publish before install); legacy IPFS backup unchanged; index.html sha256 pinned
        KipurseAppGroup: group.$(KIPURSE_BUNDLE_ID_PREFIX)$(KIPURSE_GROUP_SUFFIX)
        NSSupportsLiveActivities: true
        CFBundleDevelopmentRegion: en
        CFBundleAllowMixedLocalizations: true
        NSCameraUsageDescription: Scan the sign-in code or a receiving address.
        NSFaceIDUsageDescription: Confirm it's you before approving payments, withdrawals and limit changes.
        LSApplicationQueriesSchemes: [grokbot, com.openai.chat]
        CFBundleURLTypes:
          - { CFBundleURLName: com.kipurse.link, CFBundleURLSchemes: [kipurse] }
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
        NSLocalNetworkUsageDescription: Connect to Kipurse running on your computer (home network).
        BGTaskSchedulerPermittedIdentifiers: [com.kipurse.poll]
        UIBackgroundModes: [fetch, remote-notification]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
  KipurseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes: ["**/*.bak*", "**/*.orig", "**/*.removed*"]
    dependencies: [{ target: Kipurse }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(KIPURSE_BUNDLE_ID_PREFIX).uitests"
        TEST_TARGET_NAME: Kipurse
        GENERATE_INFOPLIST_FILE: YES
        OTHER_SWIFT_FLAGS: "$(inherited) -DKP_OWNER_PAY_$(KIPURSE_OWNER_PAY) -DKP_VARIANT_$(KIPURSE_DEBUG_SUFFIX)"   # tests know which build variant they drive
  KipurseWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Widget
        excludes: ["**/*.bak*", "**/*.orig", "**/*.removed*"]
      - path: Shared
        excludes: ["**/*.bak*", "**/*.orig", "**/*.removed*"]
    entitlements:
      path: Widget/KipurseWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(KIPURSE_BUNDLE_ID_PREFIX)$(KIPURSE_GROUP_SUFFIX)]
    settings:
      configs:
        Debug:   { PRODUCT_BUNDLE_IDENTIFIER: "$(KIPURSE_BUNDLE_ID_PREFIX).app.$(KIPURSE_DEBUG_SUFFIX).widget" }
        Release: { PRODUCT_BUNDLE_IDENTIFIER: "$(KIPURSE_BUNDLE_ID_PREFIX).app.widget" }
    info:
      path: Widget/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: $(KIPURSE_DISPLAY_NAME)
        KipurseAppGroup: group.$(KIPURSE_BUNDLE_ID_PREFIX)$(KIPURSE_GROUP_SUFFIX)
        NSExtension: { NSExtensionPointIdentifier: com.apple.widgetkit-extension }
schemes:
  Kipurse:
    build:
      targets: { Kipurse: all }
    test:
      targets: [KipurseUITests]

[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
evm_version = "cancun"
solc_version = "0.8.37"
offline = true
optimizer = true
optimizer_runs = 200
via_ir = true

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = false

[lint]
lint_on_build = false

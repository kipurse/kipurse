# SPDX-License-Identifier: Apache-2.0
# Repository guard: blocks secrets, unknown wallet addresses, the operator's private values (hashed), headerless new files and
# references to closed Pro code. Same checks as scripts/install-pre-push.sh. Make this a required status check on main.
name: guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: address allowlist, hashed denylist, SPDX headers, no Pro references
        run: node scripts/guard.mjs
      - name: gitleaks (working tree and full history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o gl.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" gl.txt | sed 's/ .*/  gl.tgz/' | sha256sum -c -
          tar -xzf gl.tgz gitleaks && rm gl.tgz gl.txt && cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" detect --no-git --source . -c .gitleaks.toml --redact --no-banner -v
          "$RUNNER_TEMP/gitleaks" detect --source . -c .gitleaks.toml --redact --no-banner

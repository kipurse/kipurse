<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kipurse</title>
<style>body{font:17px -apple-system,system-ui;max-width:640px;margin:0 auto;padding:0 14px 60px;color:#111}
.test{background:#ffb300;color:#000;font-weight:800;text-align:center;padding:10px;font-size:20px;position:sticky;top:0;z-index:9}
.step{border:2px solid #ddd;border-radius:14px;padding:14px;margin:14px 0}.step.done{border-color:#3a3}.step.now{border-color:#06c}
h2{font-size:19px;margin:0 0 8px}.en{color:#666;font-size:14px}button,.btn{display:block;width:100%;font-size:19px;padding:15px;margin:8px 0;border-radius:12px;border:0;background:#06c;color:#fff;text-align:center;text-decoration:none;box-sizing:border-box}
button.alt{background:#eee;color:#111}button.red{background:#c00}button:disabled{opacity:.4}.chips button{display:inline-block;width:auto;min-width:47%;margin:4px 1%;min-height:52px;font-size:20px;background:#eef;color:#036}.chips button.sel{background:#06c;color:#fff}
.warn{background:#fdecea;border-left:5px solid #c00;padding:10px;border-radius:8px}.ok{color:#080;font-weight:700}.bad{color:#c00;font-weight:700}.mono{font-family:ui-monospace,monospace;font-size:13px;word-break:break-all}
input[type=text]{font-size:22px;padding:12px;width:100%;box-sizing:border-box;border:2px solid #bbb;border-radius:12px;-webkit-appearance:none}.own .row{display:flex;gap:8px;align-items:center;margin-top:6px}.own b{white-space:nowrap}.lim{border-top:1px solid #eee;padding-top:6px}label{display:block;margin:10px 0;font-size:17px}td{padding:4px 6px;border-bottom:1px solid #eee;font-size:14px}svg{width:200px;height:200px}</style></head>
